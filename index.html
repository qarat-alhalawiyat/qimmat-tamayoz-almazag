<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الإغلاق المالي الشامل والتقارير - قمة تميز المذاق</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- خط تجوال -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- Firebase Compatibility SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- الهيدر والتحكم -->
    <header class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold text-emerald-400">لوحة المتابعة والرقابة المالية الشاملة</h1>
          <p class="text-xs text-slate-400" id="activeViewTitle">عرض اليومية: جاري التحميل...</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse ml-2"></span>
            مباشر وسحابي
          </span>
          <button onclick="toggleAdmin()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-lg transition shadow">
            🔐 شاشة المحاسب (إدخال وتعديل)
          </button>
        </div>
      </div>

      <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700 flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2">
          <label class="text-slate-400 font-bold">نوع العرض:</label>
          <div class="inline-flex rounded-lg bg-slate-800 p-1 border border-slate-700">
            <button id="btnModeDaily" onclick="setViewMode('daily')" class="px-3 py-1 rounded-md bg-emerald-600 text-white font-bold transition">يومي (مفصل)</button>
            <button id="btnModePeriod" onclick="setViewMode('period')" class="px-3 py-1 rounded-md text-slate-400 hover:text-white transition">تقرير فترات (أسبوعي / شهري)</button>
          </div>
        </div>

        <div id="dailyDatePickerContainer" class="flex items-center gap-2">
          <label class="text-slate-400 font-bold">اختر تاريخ اليومية للعرض:</label>
          <input type="date" id="selectedDate" onchange="onDateChange()" class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-emerald-300 text-xs">
          <button onclick="setTodayDate()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2.5 py-1.5 rounded-lg text-slate-300">اليوم</button>
        </div>

        <div id="periodPickerContainer" class="hidden flex-wrap items-center gap-2">
          <label class="text-slate-400 font-bold">من:</label>
          <input type="date" id="periodFrom" class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-blue-300 text-xs">
          <label class="text-slate-400 font-bold">إلى:</label>
          <input type="date" id="periodTo" class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-blue-300 text-xs">
          <button onclick="loadPeriodReport()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-lg transition">🔍 استخراج التقرير التجميعي</button>
